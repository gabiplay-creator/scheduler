            </div>
          )}
        </div>
      </div>

      {printMonth && (
        <div className="print-area">
          <h2 className="print-title">공정표 · {printMonth.y}년 {printMonth.m+1}월</h2>
          {renderCalendarBlock([printMonth], [...sites].sort((a,b) => (a.order??0) - (b.order??0)))}
        </div>
      )}

      {true && (
        <div className="no-print">
          {renderCalendarBlock([cursor, addMonths(cursor, 1)])}

          <div className="card cal-legend-card">
            <div className="cal-legend">
              {relevantSites.map(s => (
                <span className="legend-item" key={s.id}>
                  <span className="legend-dot" style={{background: siteBgMap[s.id], boxShadow:"inset 0 0 0 1px rgba(0,0,0,.25)"}} />
                  {s.name}
                </span>
              ))}
            </div>
          </div>

          {selectedDate && (
            <div className="daypanel">
              <p className="eyebrow">{selectedDate}</p>
              {projectItems.filter(p => { const {start,end} = scheduleRange(p); return selectedDate>=start && selectedDate<=end; }).map(p => (
                <div className="tag ok" key={p.id} style={{marginBottom:8, display:"inline-block"}}>
                  🗂 {siteById[p.siteId]?.name} 전체 공사기간 진행 중
                </div>
              ))}
              {schedulesOn(selectedDate).length===0 ? (
                <div className="empty">이 날짜에 진행 중인 공사가 없습니다.</div>
              ) : (
                schedulesOn(selectedDate).map(sc => (
                  <ScheduleRow key={sc.id} sc={sc} trade={tradeById[sc.tradeId]} site={siteById[sc.siteId]} onDelete={()=>setSchedules(prev=>prev.filter(s=>s.id!==sc.id))} onEdit={()=>setEditingScheduleId(sc.id)} />
                ))
              )}
            </div>
          )}
        </div>
      )}

      {workerEdit && siteById[workerEdit.siteId] && (
        <DayWorkersEditModal
          site={siteById[workerEdit.siteId]}
          date={workerEdit.date}
          note={dayNoteMap[`${workerEdit.siteId}_${workerEdit.date}`]}
          nameSuggestions={nameSuggestions}
          lastWageByName={lastWageByName}
          onClose={()=>setWorkerEdit(null)}
          onSave={(workers, text) => saveDayWorkers(workerEdit.siteId, workerEdit.date, workers, text)}
        />
      )}

      {showJpg && (
        <CustomerJpgModal
          sites={sites}
          defaultSiteId={relevantSites[0]?.id}
          schedules={schedules}
          tradeById={tradeById}
          siteBgMap={siteBgMap}
          onClose={()=>setShowJpg(false)}
        />
      )}


      {editingScheduleId && (() => {
        const sc = schedules.find(s => s.id===editingScheduleId);
        if(!sc) return null;
        const trade = tradeById[sc.tradeId];
        const site = siteById[sc.siteId];
        return (
          <EditScheduleModal
            schedule={sc}
            trade={trade}
            site={site}
            onClose={()=>setEditingScheduleId(null)}
            onSave={patch => { setSchedules(prev => prev.map(s => s.id===sc.id ? {...s, ...patch} : s)); setEditingScheduleId(null); }}
            onDelete={() => { setSchedules(prev=>prev.filter(s=>s.id!==sc.id)); setEditingScheduleId(null); }}
          />
        );
      })()}

      {quickAdd && sites.length>0 && (
        <QuickAddScheduleModal
          sites={sites}
          initialSiteId={quickAdd.siteId}
          trades={trades}
          initialDate={quickAdd.date}
          onClose={()=>setQuickAdd(null)}
          onAdd={(siteId, sc, newTradeName) => {
            let tradeId = sc.tradeId;
            if(newTradeName){
              tradeId = "trade-" + uid();
              const color = nextTradeColor(trades.map(t=>t.color));
              setTrades(prev => [...prev, { id: tradeId, name: newTradeName, color, note: "", contacts: [{ id: uid(), name:"", phone:"", bank:"", account:"", isDefault:true }] }]);
            }
            setSchedules(prev => [...prev, { ...sc, tradeId, id: uid(), siteId }]);
            setQuickAdd(null);
          }}
        />
      )}

      {workerEditor && (
        <DayWorkersModal
          site={workerEditor.site}
          date={workerEditor.date}
          trades={workerEditor.trades}
          onClose={()=>setWorkerEditor(null)}
          onSave={updates => {
            setSchedules(prev => {
              let next = prev.map(sc => {
                const found = updates.find(u => !u.isNew && u.id===sc.id);
                return found ? { ...sc, workerName: found.workerName } : sc;
              });
              const toCreate = updates.filter(u => u.isNew && u.workerName);
              toCreate.forEach(u => {
                next = [...next, {
                  id: uid(), siteId: workerEditor.site.id, tradeId: u.tradeId,
                  startDate: workerEditor.date, endDate: workerEditor.date,
                  contactId: "", workerName: u.workerName, laborUnits: null, memo: "",
                }];
              });
              return next;
            });
          }}
        />
      )}
    </div>
  );
}

function ScheduleRow({ sc, trade, site, onDelete, onEdit }){
  const contact = resolveContact(sc, trade);
  const { start, end } = scheduleRange(sc);
  const span = daySpan(sc);
  return (
    <div className="day-sched" onClick={onEdit} style={onEdit ? {cursor:"pointer"} : {}}>
      <span className="swatch-bar" style={{background: trade?.color}} />
      <div style={{flex:1}}>
        <div style={{fontWeight:800, fontSize:14}}>{trade?.name} · {site?.name}</div>
        <div style={{fontSize:13, color:"var(--ink-soft)"}}>
          {start}{end!==start && ` ~ ${end}`} ({span}일) · 담당자: {contact?.name || "미지정"} {contact?.phone && `· ${contact.phone}`}
        </div>
        {sc.memo && <div style={{fontSize:12.5, color:"var(--ink-soft)", marginTop:2}}>메모: {sc.memo}</div>}
      </div>
      <button className="btn btn-danger btn-sm" onClick={e=>{ e.stopPropagation(); onDelete(); }}>삭제</button>
    </div>
  );
}

/* ---------- Contacts tab ---------- */
function ContactsTab({ trades, setTrades, schedules, setSchedules }){
  const [showAddTrade, setShowAddTrade] = useState(false);

  function updateContact(tradeId, contactId, patch){
    setTrades(prev => prev.map(t => t.id!==tradeId ? t : {
      ...t, contacts: t.contacts.map(c => c.id===contactId ? {...c, ...patch} : c)
    }));
  }
  function addContact(tradeId){
    setTrades(prev => prev.map(t => t.id!==tradeId ? t : {
      ...t, contacts: [...t.contacts, {id: uid(), name:"", phone:"", bank:"", account:"", isDefault:false}]
    }));
  }
  function deleteContact(tradeId, contactId){
    setTrades(prev => prev.map(t => {
      if(t.id!==tradeId) return t;
      if(t.contacts.length<=1){ alert("최소 1명의 담당자는 유지해야 합니다."); return t; }
      return {...t, contacts: t.contacts.filter(c=>c.id!==contactId)};
    }));
  }
  function makeDefault(tradeId, contactId){
    setTrades(prev => prev.map(t => t.id!==tradeId ? t : {
      ...t, contacts: t.contacts.map(c => ({...c, isDefault: c.id===contactId}))
    }));
  }
  function addTrade({ name, note, contactName, phone, bank, account }){
    const color = nextTradeColor(trades.map(t=>t.color));
    const newTrade = {
      id: "trade-" + uid(),
      name, color, note,
      contacts: [
        { id: uid(), name: contactName, phone, bank, account, isDefault: true },
        { id: uid(), name: "", phone: "", bank: "", account: "", isDefault: false },
      ],
    };
    setTrades(prev => [...prev, newTrade]);
    setShowAddTrade(false);
  }
  function deleteTrade(tradeId, tradeName){
    if(!confirm(`"${tradeName}" 공정을 삭제하면 관련된 일정도 함께 삭제됩니다. 계속할까요?`)) return;
    setTrades(prev => prev.filter(t => t.id!==tradeId && t.mergedInto!==tradeId));
    setSchedules(prev => prev.filter(sc => sc.tradeId!==tradeId));
  }

  return (
    <div>
      <div className="section-head">
        <div>
          <p className="eyebrow">CONTACTS</p>
          <h2>공사별 담당자</h2>
        </div>
        <button className="btn btn-accent" onClick={()=>setShowAddTrade(true)}>+ 공정 추가</button>
      </div>

      {sortedTradeList(trades).map(trade => (
        <div className="card contact-card" key={trade.id}>
          <div className="contact-head">
            <label className="trade-color-pick" title="공정 글자색 바꾸기" style={{background:trade.color}}>
              <input type="color" value={trade.color} onChange={e=>{ const c = e.target.value; setTrades(prev => prev.map(t => t.id===trade.id ? {...t, color:c} : t)); }} />
            </label>
            <h4 style={{flex:1, color: tradeTextColor(trade.color)}}>{trade.name}</h4>
            <button className="btn btn-danger btn-sm" onClick={()=>deleteTrade(trade.id, trade.name)}>공정 삭제</button>
          </div>
          <p className="contact-note">{trade.note}</p>

          {trade.contacts.map(c => (
            <div className="contact-item" key={c.id}>
              <input type="text" value={c.name} placeholder="이름" onChange={e=>updateContact(trade.id, c.id, {name:e.target.value})} />
              <input type="text" value={c.phone} placeholder="전화번호" onChange={e=>updateContact(trade.id, c.id, {phone:e.target.value})} />
              <input type="text" value={c.bank} placeholder="은행" onChange={e=>updateContact(trade.id, c.id, {bank:e.target.value})} />
              <input type="text" value={c.account} placeholder="계좌번호" onChange={e=>updateContact(trade.id, c.id, {account:e.target.value})} />
              <input type="number" min="0" step="10000" value={c.dailyWage ?? ""} placeholder="일당(원)" title="1품당 일당 (원)" onChange={e=>updateContact(trade.id, c.id, {dailyWage: e.target.value==="" ? null : Number(e.target.value)})} />
              <div style={{display:"flex", gap:6, alignItems:"center", justifyContent:"flex-end"}}>
                {c.isDefault ? <span className="default-badge">기본</span> : (
                  <button className="btn btn-ghost btn-sm" onClick={()=>makeDefault(trade.id, c.id)}>기본으로</button>
                )}
                <button className="btn btn-danger btn-sm" onClick={()=>deleteContact(trade.id, c.id)}>✕</button>
              </div>
            </div>
          ))}

          <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={()=>addContact(trade.id)}>+ 담당자 추가</button>
        </div>
      ))}

      {showAddTrade && <AddTradeModal onClose={()=>setShowAddTrade(false)} onSave={addTrade} />}
    </div>
  );
}

/* ---------- Vendors tab (거래처관리) ---------- */
function VendorsTab({ vendors, setVendors }){
  const [showAdd, setShowAdd] = useState(false);

  function addVendor(v){
    setVendors(prev => [...prev, { ...v, id: uid() }]);
    setShowAdd(false);
  }
  function updateVendor(id, patch){
    setVendors(prev => prev.map(v => v.id===id ? {...v, ...patch} : v));
  }
  function deleteVendor(id){
    if(!confirm("이 거래처 정보를 삭제할까요?")) return;
    setVendors(prev => prev.filter(v => v.id!==id));
  }

  return (
    <div>
      <div className="section-head">
        <div>
          <p className="eyebrow">VENDORS</p>
          <h2>거래처 / 업체 정보</h2>
        </div>
        <button className="btn btn-accent" onClick={()=>setShowAdd(true)}>+ 업체 추가</button>
      </div>

      {vendors.length===0 ? (
        <div className="empty"><b>등록된 거래처가 없습니다.</b><br/>자재상, 조명, 기타 협력업체 등 공정에 속하지 않는 업체 정보를 등록해보세요.</div>
      ) : (
        <div className="card">
          {vendors.map(v => (
            <div className="vendor-item" key={v.id}>
              <input type="text" value={v.name} placeholder="업체명" onChange={e=>updateVendor(v.id, {name:e.target.value})} />
              <input type="text" value={v.phone} placeholder="전화번호" onChange={e=>updateVendor(v.id, {phone:e.target.value})} />
              <input type="text" value={v.memo} placeholder="메모 (담당자, 품목 등)" onChange={e=>updateVendor(v.id, {memo:e.target.value})} />
              <button className="btn btn-danger btn-sm" onClick={()=>deleteVendor(v.id)}>✕</button>
            </div>
          ))}
        </div>
      )}

      {showAdd && <VendorFormModal onClose={()=>setShowAdd(false)} onSave={addVendor} />}
    </div>
  );
}

function VendorFormModal({ onClose, onSave }){
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [memo, setMemo] = useState("");

  function submit(){
    if(!name.trim()){ alert("업체명을 입력해주세요."); return; }
    onSave({ name: name.trim(), phone: phone.trim(), memo: memo.trim() });
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-head">
          <h3>거래처 추가</h3>
          <button className="close-x" onClick={onClose}>✕</button>
        </div>
        <div className="field">
          <label>업체명</label>
          <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="예: 한빛조명" />
        </div>
        <div className="field">
          <label>전화번호</label>
          <input type="text" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="예: 010-1234-5678" />
        </div>
        <div className="field">
          <label>메모</label>
          <input type="text" value={memo} onChange={e=>setMemo(e.target.value)} placeholder="담당자, 취급 품목 등" />
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>취소</button>
          <button className="btn btn-primary" onClick={submit}>저장</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Labor tab (담당자관리 — 품수 집계) ---------- */
function SitePayroll({ sites, dayNotes, monthStart, monthEnd }){
  const [scope, setScope] = useState("all"); // "all" = 전체 기간, "month" = 이번 달
  const notes = dayNotes.filter(n => scope==="all" || (n.date>=monthStart && n.date<=monthEnd));
  const bySite = {};
  notes.forEach(n => (n.workers||[]).forEach(w => {
    if(!w.name) return;
    const site = (bySite[n.siteId] = bySite[n.siteId] || { people:{}, total:0, missing:0 });
    const p = (site.people[w.name] = site.people[w.name] || { days:0, amount:0, missing:0 });
    p.days += 1;
    if(w.wage!=null){ p.amount += Number(w.wage); site.total += Number(w.wage); } else { p.missing += 1; site.missing += 1; }
  }));
  const orderedSites = [...sites].sort((a,b) => (a.order??0)-(b.order??0)).filter(s => bySite[s.id]);
  const grand = orderedSites.reduce((sum, s) => sum + bySite[s.id].total, 0);
  return (
    <div style={{marginBottom:28}}>
      <div className="section-head" style={{marginBottom:10}}>
        <div>
          <p className="eyebrow">PAYROLL / 현장별 인건비</p>
          <h2>현장별 출근 인원 지급액</h2>
        </div>
        <div className="view-toggle">
          <button className={scope==="all"?"active":""} onClick={()=>setScope("all")}>전체 기간</button>
          <button className={scope==="month"?"active":""} onClick={()=>setScope("month")}>이번 달만</button>
        </div>
      </div>
      <p style={{fontSize:13, color:"var(--ink-soft)", margin:"0 0 12px"}}>캘린더 각 현장 맨 아래 <b>인원</b> 칸에 입력한 이름·일당을 현장별·사람별로 자동 합산합니다.</p>
      {orderedSites.length===0 ? (
        <div className="empty">입력된 출근 인원이 없습니다.<br/>캘린더에서 현장 맨 아래 "인원" 칸을 눌러 이름과 일당을 넣어보세요.</div>
      ) : (
        <>
          {orderedSites.map(site => {
            const data = bySite[site.id];
            return (
              <div className="card" style={{marginBottom:12}} key={site.id}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
                  <h4 style={{margin:0, fontSize:15}}>{site.name}</h4>
                  <span style={{fontFamily:"var(--mono)", fontWeight:800, color:"var(--navy)"}}>{data.total.toLocaleString("ko-KR")}원</span>
                </div>
                {Object.entries(data.people).sort((a,b)=>b[1].amount-a[1].amount).map(([name, p]) => (
                  <div key={name} className="payroll-row">
                    <span>{name}</span>
                    <span className="payroll-days">{p.days}일{p.missing ? ` (일당 미입력 ${p.missing}일)` : ""}</span>
                    <span className="payroll-amount">{p.amount.toLocaleString("ko-KR")}원</span>
                  </div>
                ))}
              </div>
            );
          })}
          <div className="card" style={{background:"var(--navy-deep)", color:"#fff"}}>
            <div style={{display:"flex", justifyContent:"space-between", fontWeight:800, fontSize:14}}>
              <span>{scope==="all" ? "전체 기간" : "이번 달"} 인건비 합계</span>
              <span style={{fontFamily:"var(--mono)"}}>{grand.toLocaleString("ko-KR")}원</span>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function LaborTab({ trades, sites, schedules, dayNotes }){
  const [cursor, setCursor] = useState(() => { const d = new Date(); return {y: d.getFullYear(), m: d.getMonth()}; });

  function changeMonth(delta){
    setCursor(prev => {
      let nm = prev.m + delta, ny = prev.y;
      while(nm<0){ nm+=12; ny--; }
      while(nm>11){ nm-=12; ny++; }
      return { y: ny, m: nm };
    });
  }

  const monthStart = `${cursor.y}-${pad(cursor.m+1)}-01`;
  const monthEnd = `${cursor.y}-${pad(cursor.m+1)}-${pad(new Date(cursor.y, cursor.m+1, 0).getDate())}`;
  const tradeById = Object.fromEntries(trades.map(t=>[t.id,t]));

  const monthSchedules = schedules.filter(sc => {
    const { start, end } = scheduleRange(sc);
    return start<=monthEnd && end>=monthStart;
  });

  const grouped = {};
  monthSchedules.forEach(sc => {
    const trade = tradeById[sc.tradeId];
    if(!trade) return;
    const contact = trade.contacts.find(c => c.id===sc.contactId);
    const names = splitWorkerNames(sc.workerName);
    const workerNames = names.length ? names : [contact?.name || "작업자 미입력"];
    if(!grouped[trade.id]) grouped[trade.id] = { trade, contacts: {} };
    workerNames.forEach(workerName => {
      if(!grouped[trade.id].contacts[workerName]) grouped[trade.id].contacts[workerName] = { units: 0, count: 0 };
      grouped[trade.id].contacts[workerName].units += (sc.laborUnits || 0);
      grouped[trade.id].contacts[workerName].count += 1;
    });
  });

  const groupList = sortedTradeList(trades).map(t => grouped[t.id]).filter(Boolean);
  const grandTotal = groupList.reduce((sum, g) => sum + Object.values(g.contacts).reduce((s,c) => s+c.units, 0), 0);

  return (
    <div>
      <div className="section-head">
        <div>
          <p className="eyebrow">LABOR / 품수 집계</p>
          <h2>담당자 품수 관리</h2>
        </div>
        <div className="cal-nav">
          <button onClick={()=>changeMonth(-1)}>‹</button>
          <span className="cal-month">{cursor.y}. {pad(cursor.m+1)}</span>
          <button onClick={()=>changeMonth(1)}>›</button>
        </div>
      </div>

      <SitePayroll sites={sites} dayNotes={dayNotes} monthStart={monthStart} monthEnd={monthEnd} />

      <p style={{fontSize:13, color:"var(--ink-soft)", marginBottom:16, maxWidth:640}}>
        캘린더에서 일정을 추가·수정할 때 입력한 <b>품수(0.5 단위)</b>를 공정별·담당자별로 이번 달 기준 합산합니다. 일당 계산할 때 참고하세요.
      </p>

      {groupList.length===0 ? (
        <div className="empty">이번 달에 품수가 입력된 일정이 없습니다.<br/>캘린더에서 일정을 추가하거나 수정할 때 "품수" 칸에 값을 넣어보세요.</div>
      ) : (
        <>
          {groupList.map(g => (
            <div className="card" style={{marginBottom:12}} key={g.trade.id}>
              <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:10}}>
                <span className="trade-swatch" style={{background:g.trade.color}} />
                <h4 style={{margin:0, fontSize:15}}>{g.trade.name}</h4>
              </div>
              {Object.entries(g.contacts).map(([name, data]) => (
                <div key={name} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 2px", borderTop:"1px solid var(--paper-line)", fontSize:13.5}}>
                  <span>{name}</span>
                  <span style={{fontFamily:"var(--mono)", fontWeight:800, color:"var(--navy)"}}>{data.units}품 <span style={{color:"var(--ink-soft)", fontWeight:600}}>({data.count}건)</span></span>
                </div>
              ))}
            </div>
          ))}
          <div className="card" style={{background:"var(--navy-deep)", color:"#fff"}}>
            <div style={{display:"flex", justifyContent:"space-between", fontWeight:800, fontSize:14}}>
              <span>이번 달 전체 합계</span>
              <span style={{fontFamily:"var(--mono)"}}>{grandTotal}품</span>
            </div>
          </div>
        </>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

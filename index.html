<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공정표 — 인테리어 공사 스케줄러</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy-deep:#16233F;
    --navy:#1E3A5F;
    --steel:#3D6690;
    --steel-light:#7C9CB8;
    --paper:#F5F2EA;
    --paper-line:#E1D9C4;
    --card:#FFFFFF;
    --ink:#23262B;
    --ink-soft:#5B5F66;
    --accent:#E2792F;
    --accent-soft:#F6D9BE;
    --green:#4A7C59;
    --danger:#B23A48;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --excel-line: #444C56;
    --excel-line-soft: #B9BEC4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    min-height:100vh;
  }
  button{font-family:var(--sans);cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}

  .app{width:1240px;max-width:none;margin:0 auto;padding:0 20px 80px;}

  /* header */
  .header{
    background:var(--navy-deep);
    color:#fff;
    margin:0 -20px 0;
    padding:28px 20px 0;
  }
  .header-inner{width:1240px;max-width:none;margin:0 auto;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .title{
    font-size:28px;
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .subtitle{color:var(--steel-light);font-size:13px;margin:0 0 18px;}
  .ruler{
    height:22px;
    display:flex;
    align-items:flex-end;
    gap:0;
    overflow:hidden;
    border-top:1px solid rgba(255,255,255,.15);
  }
  .ruler span{
    flex:1;
    border-left:1px solid rgba(255,255,255,.25);
    height:8px;
  }
  .ruler span:nth-child(5n+1){height:14px;border-left:1px solid rgba(255,255,255,.4);}

  .tabs{display:flex;gap:4px;margin-top:16px;}
  .tab{
    background:transparent;border:none;
    color:var(--steel-light);
    font-size:14px;font-weight:700;
    padding:10px 16px;border-radius:8px 8px 0 0;
    border-bottom:3px solid transparent;
  }
  .tab.active{color:#fff;border-bottom:3px solid var(--accent);background:rgba(255,255,255,0.06);}
  .tab:hover{color:#fff;}

  .content{padding-top:24px;}

  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:19px;margin:0 0 2px;}
  .section-head .eyebrow{color:var(--steel);}

  .btn{
    border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--navy-deep);color:#fff;}
  .btn-primary:hover{background:var(--navy);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:#c9661f;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--paper-line);}
  .btn-ghost:hover{border-color:var(--steel);color:var(--navy);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid #e3c2c6;}
  .btn-danger:hover{background:#fbeff0;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* cards */
  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:18px;
    box-shadow:0 1px 2px rgba(20,20,20,0.03);
  }
  .grid-sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .site-card{position:relative;cursor:grab;transition:box-shadow .15s, border-color .15s;}
  .site-card:active{cursor:grabbing;}
  .site-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
  .drag-handle{position:absolute;top:12px;right:22px;color:var(--paper-line);font-size:16px;letter-spacing:-2px;}
  .site-card.site-ended{background:#E7E5E0;filter:grayscale(.35);}
  .site-card.site-ended .site-name,.site-card.site-ended .site-addr{color:var(--ink-soft);}
  .badge-ended{
    font-family:var(--mono);font-size:11px;font-weight:800;background:var(--ink-soft);color:#fff;
    padding:3px 8px;border-radius:5px;letter-spacing:.03em;margin-left:8px;vertical-align:middle;display:inline-block;
  }
  .site-card .corner{
    position:absolute;top:0;right:0;width:0;height:0;
    border-style:solid;border-width:0 18px 18px 0;
    border-color:transparent var(--accent-soft) transparent transparent;
    border-radius:0 12px 0 0;
  }
  .site-name{font-size:16px;font-weight:800;margin:0 0 2px;}
  .site-addr{font-size:13px;color:var(--ink-soft);margin:0 0 12px;display:flex;gap:6px;align-items:flex-start;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tag{
    font-family:var(--mono);font-size:11px;letter-spacing:.03em;
    background:var(--paper);border:1px dashed var(--paper-line);color:var(--ink-soft);
    padding:3px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:4px;
  }
  .tag.ok{color:var(--green);border-color:#bcd8c4;background:#eef6f0;}
  .site-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .empty{
    border:1.5px dashed var(--paper-line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--ink-soft);
  }
  .empty b{color:var(--ink);}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(22,35,63,.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--card);border-radius:14px;max-width:640px;width:100%;
    padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:18px;}
  .close-x{background:none;border:none;color:var(--ink-soft);font-size:18px;padding:4px;border-radius:6px;}
  .close-x:hover{background:var(--paper);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.02em;}
  .field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--paper-line);border-radius:8px;font-size:14px;background:var(--paper);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--steel);outline-offset:1px;}
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .file-drop{
    border:1.5px dashed var(--paper-line);border-radius:8px;padding:12px;
    display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);background:var(--paper);
  }
  .file-drop input{display:none;}
  .file-drop label{cursor:pointer;background:var(--navy-deep);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;flex-shrink:0;}
  .file-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--paper-line);flex-shrink:0;}
  .file-badge{
    width:44px;height:44px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.02em;color:#fff;
  }
  .excel-table-wrap{max-height:60vh;overflow:auto;border:1px solid var(--paper-line);border-radius:8px;}
  .excel-table-wrap table{border-collapse:collapse;width:100%;font-size:12.5px;}
  .excel-table-wrap td,.excel-table-wrap th{border:1px solid var(--paper-line);padding:5px 8px;white-space:nowrap;}
  .excel-table-wrap tr:first-child td,.excel-table-wrap tr:first-child th{background:var(--paper);font-weight:700;}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  /* trades / contacts */
  .trade-list{display:flex;flex-direction:column;gap:10px;}
  .trade-row{
    display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--paper-line);border-radius:10px;background:var(--paper);
  }
  .trade-row.trade-row-active{background:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(226,121,47,.18);}
  .badge-active-now{
    font-family:var(--mono);font-size:10px;font-weight:800;background:var(--accent);color:#fff;
    padding:2px 7px;border-radius:5px;letter-spacing:.03em;margin-left:8px;vertical-align:middle;display:inline-block;
  }
  .trade-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .trade-info{flex:1;min-width:0;}
  .trade-name{font-weight:800;font-size:14px;}
  .trade-note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .sched-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .chip{
    font-size:11.5px;background:var(--paper);border:1px solid var(--paper-line);border-radius:6px;padding:4px 8px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip .x{cursor:pointer;color:var(--ink-soft);font-weight:700;}
  .chip .x:hover{color:var(--danger);}

  /* contacts tab */
  .contact-card{margin-bottom:12px;}
  .contact-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .contact-head .trade-swatch{width:12px;height:12px;}
  .contact-head h4{margin:0;font-size:15px;}
  .trade-color-pick{width:22px;height:22px;border-radius:6px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex-shrink:0;}
  .trade-color-pick input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:none;padding:0;}
  .contact-note{font-size:12px;color:var(--ink-soft);margin:0 0 10px;font-style:italic;}
  .contact-item{
    display:grid;grid-template-columns:1.1fr 1fr 0.7fr 1.1fr 0.8fr auto;gap:8px;align-items:center;
    padding:8px 0;border-top:1px solid var(--paper-line);font-size:13px;
  }
  .contact-item:first-of-type{border-top:none;}
  .contact-item input{padding:6px 8px;border:1px solid var(--paper-line);border-radius:6px;font-size:13px;width:100%;background:var(--paper);}
  .default-badge{font-family:var(--mono);font-size:10px;background:var(--accent-soft);color:#8a4213;padding:2px 6px;border-radius:4px;letter-spacing:.03em;}

  .vendor-item{
    display:grid;grid-template-columns:1.1fr 0.9fr 1.4fr auto;gap:8px;align-items:center;
    padding:10px 0;border-top:1px solid var(--paper-line);font-size:13px;
  }
  .vendor-item:first-of-type{border-top:none;}
  .vendor-item input{padding:7px 9px;border:1px solid var(--paper-line);border-radius:6px;font-size:13px;width:100%;background:var(--paper);}

  /* calendar */
  .view-toggle{display:flex;border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;}
  .view-toggle button{background:var(--card);border:none;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .view-toggle button.active{background:var(--navy-deep);color:#fff;}
  .view-toggle button:not(:last-child){border-right:1px solid var(--paper-line);}

  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-nav button{background:var(--card);border:1px solid var(--paper-line);border-radius:8px;width:32px;height:32px;font-size:15px;}
  .cal-month{font-size:16px;font-weight:800;font-family:var(--mono);min-width:110px;text-align:center;}
  .cal-filter select{padding:8px 10px;border-radius:8px;border:1px solid var(--paper-line);font-size:13px;background:var(--card);}
  .site-multiselect{position:relative;}
  .site-multiselect-btn{
    padding:8px 12px;border-radius:8px;border:1px solid var(--paper-line);font-size:13px;background:var(--card);
    cursor:pointer;white-space:nowrap;font-weight:600;color:var(--ink);
  }
  .site-multiselect-btn:hover{border-color:var(--steel);}
  .site-multiselect-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--card);
    border:1px solid var(--paper-line);border-radius:10px;box-shadow:0 8px 20px rgba(22,35,63,0.15);
    padding:10px;min-width:270px;max-height:320px;overflow-y:auto;
  }
  .site-multiselect-actions{display:flex;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--paper-line);}
  .site-multiselect-actions button{
    flex:1;font-size:11.5px;padding:5px 6px;border-radius:6px;border:1px solid var(--paper-line);background:var(--paper);cursor:pointer;color:var(--ink-soft);
  }
  .site-multiselect-actions button:hover{border-color:var(--steel);color:var(--navy);}
  .site-multiselect-actions button.on{background:var(--navy-deep);color:#fff;border-color:var(--navy-deep);}
  .site-multiselect-actions button{white-space:nowrap;}
  .site-multiselect-item{
    display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 4px;border-radius:6px;cursor:pointer;
  }
  .site-multiselect-item:hover{background:var(--paper);}
  .site-multiselect-item input{cursor:pointer;}
  .site-multiselect-empty{font-size:12.5px;color:var(--ink-soft);padding:6px 4px;}
  .color-swatch-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .color-swatch{
    width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;
    box-shadow:0 0 0 1px var(--paper-line);position:relative;
  }
  .color-swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink);}
  .color-swatch-custom{overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px dashed var(--paper-line);}
  .color-swatch-custom input[type=color]{opacity:0;width:100%;height:100%;cursor:pointer;}
  .cal-dow-spacer{border:1px solid var(--excel-line-soft);background:var(--navy);}
  .by-site-list{display:flex;flex-direction:column;gap:22px;}
  .by-site-section{border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;background:var(--card);}
  .by-site-header{
    padding:10px 16px;color:#fff;font-weight:800;font-size:14px;letter-spacing:.01em;
  }
  .by-site-section .cal-continuous{border:none;border-radius:0;box-shadow:none;padding:16px;}
  .cal-continuous{padding:0;background:#fff;border:1px solid var(--excel-line);border-radius:0;overflow:visible;box-shadow:none;}
  .cal-month-segment{position:relative;}
  .cal-cell.month-boundary-top{border-top:2px solid var(--accent) !important;}
  .cal-cell.month-boundary-left{border-left:2px solid var(--accent) !important;}
  .week-row.week-stripe-a .cal-cell,.week-row.week-stripe-b .cal-cell{border-top:1px solid var(--excel-line-soft);}
  .cal-month-rail-spacer{width:46px;flex-shrink:0;}
  .cal-month-badge{
    width:46px;flex-shrink:0;align-self:flex-start;position:sticky;top:10px;
    margin:0 0 0 2px;background:var(--navy-deep);color:#fff;
    font-family:var(--sans);font-weight:800;font-size:13px;line-height:1.35;
    text-align:center;border-radius:4px;padding:9px 2px;box-shadow:0 2px 6px rgba(22,35,63,.3);
    z-index:6;user-select:none;
  }
  .cal-legend-card{margin-top:14px;padding:14px 18px;}
  @media (max-width:900px){
    .app,.header-inner{width:1180px;}
  }
  .week-row{margin-bottom:0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;position:relative;z-index:1;}
  .cal-grid.has-labels{grid-template-columns:132px repeat(7,1fr);}
  .cal-date-row{margin-bottom:0;}
  .cal-site-row-grid{
    display:grid;grid-template-columns:132px repeat(7,1fr);gap:0;
  }
  .site-label-tab{
    display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 7px;
    border-top:2px solid var(--excel-line);border-left:1px solid var(--excel-line);border-right:1px solid var(--excel-line);
    background:#fff;box-sizing:border-box;
    font-size:13px;font-weight:800;line-height:1.25;overflow:hidden;
  }
  .site-label-tab:first-child{border-top:none;}
  .site-label-tab-inner{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;}
  .site-label-tab-inner > span:first-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;}
  .site-label-tab.has-abbr{justify-content:center;}
  .site-label-manager{
    font-size:10px;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%;
  }
  .site-label-abbr{
    font-size:20px;font-weight:800;line-height:1.1;text-align:center;
    -webkit-line-clamp:2 !important;
  }
  .cal-cell{
    background:var(--navy);border:1px solid var(--excel-line-soft);border-radius:0;min-height:34px;padding:0;
    display:flex;align-items:center;cursor:pointer;overflow:hidden;
  }
  .cal-cell.outside-month{background:#3E5878;}
  .cal-cell.empty-cell{background:#fff;border:1px solid var(--excel-line-soft);cursor:default;}
  .cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-cell.picked{border-color:#fff;box-shadow:inset 0 0 0 1.5px #fff;}
  .cal-cell.drag-over{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft);}
  .cal-cell:hover:not(.empty-cell){border-color:var(--steel);}
  .cal-date{
    font-family:var(--sans);font-size:15px;font-weight:800;color:#fff;padding:4px 6px;
    display:flex;justify-content:space-between;align-items:baseline;line-height:1;width:100%;
  }
  .cal-date-sun{color:#FF8A80;}
  .cal-date-sat{color:#80D8FF;}
  .cal-dow-inline{font-size:12px;margin-left:5px;opacity:.75;}
  .trade-slot-empty{
    cursor:pointer;border-radius:0;min-height:38px;box-sizing:border-box;
    border:1px solid var(--excel-line-soft);background:#fff;
  }
  .trade-slot-empty:hover{filter:brightness(.93);box-shadow:inset 0 0 0 2px var(--accent);}
  .trade-day-chip{
    width:100%;min-height:38px;height:auto;border-radius:0;display:flex;align-items:center;padding:4px 7px;overflow:visible;
    box-shadow:none;box-sizing:border-box;cursor:grab;border:1px solid var(--excel-line-soft);
  }
  .trade-day-chip:active{cursor:grabbing;}
  .trade-day-chip .chip-main{color:#1a1a1a;font-weight:800;white-space:normal;overflow:visible;line-height:1.2;word-break:keep-all;overflow-wrap:break-word;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);}
  .legend-dot{width:9px;height:9px;border-radius:3px;}

  .daypanel{margin-top:16px;}
  .day-sched{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--paper-line);border-radius:10px;margin-bottom:8px;}
  .day-sched .swatch-bar{width:4px;border-radius:3px;align-self:stretch;}

  /* 출력 버튼 줄 */
  .export-bar{display:flex;gap:8px;justify-content:flex-end;margin:-6px 0 12px;flex-wrap:wrap;}
  .export-bar .btn-ghost{background:var(--card);}
  .print-menu-item{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 6px;border-radius:6px;font-size:13px;font-weight:700;color:var(--ink);}
  .print-menu-item:hover{background:var(--paper);}
  .print-area{display:none;width:1100px;}
  .print-area.measuring{display:block;position:absolute;left:-30000px;top:0;}
  .print-area .cal-month-badge, .print-area .cal-month-rail-spacer{display:none;}
  .print-area .cal-continuous{border:1px solid var(--excel-line);}
  .print-title{font-size:20px;margin:0 0 10px;color:#16233F;}

// Drop-in replacement for useState + localStorage persistence, but when Firebase is
// configured it also keeps the data live-synced (in real time) across everyone using
// the app: each record is its own Firestore document (by its `id`), so different
// people editing different sites/trades/schedules at once don't clobber each other.
function useSyncedState(collectionName, initialValue){
  const [state, setStateRaw] = useState(() => loadLS("scheduler:"+collectionName, initialValue));
  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => {
    if(!fbReady()) return;
    let firstSnapshot = true;
    const unsub = fbCollection(collectionName).onSnapshot(snap => {
      if(firstSnapshot && snap.empty){
        firstSnapshot = false;
        const seed = (stateRef.current && stateRef.current.length) ? stateRef.current : initialValue;
        if(seed && seed.length){
          const batch = _fbDb.batch();
          seed.forEach(item => batch.set(fbCollection(collectionName).doc(String(item.id)), item));
          batch.commit().catch(err => console.error("initial seed failed:", err));
        }
        return; // the batch write above will trigger another snapshot with the real data
      }
      firstSnapshot = false;
      const list = snap.docs.map(d => d.data());
      setStateRaw(list);
      saveLS("scheduler:"+collectionName, list);
    }, err => console.error("sync error on", collectionName, err));
    return () => unsub();
  }, [collectionName]);

  const setState = useCallback((updater) => {
    setStateRaw(prev => {
      const next = typeof updater==="function" ? updater(prev) : updater;
      saveLS("scheduler:"+collectionName, next);
      if(fbReady()){
        const batch = _fbDb.batch();
        let ops = 0;
        const prevIds = new Set(prev.map(x=>x.id));
        next.forEach(item => {
          const prevItem = prev.find(p=>p.id===item.id);
          if(!prevItem || JSON.stringify(prevItem)!==JSON.stringify(item)){
            batch.set(fbCollection(collectionName).doc(String(item.id)), item);
            ops++;
          }
        });
        prev.forEach(item => {
          if(!next.some(n=>n.id===item.id)){
            batch.delete(fbCollection(collectionName).doc(String(item.id)));
            ops++;
          }
        });
        if(ops>0) batch.commit().catch(err => console.error("sync write failed:", err));
      }
      return next;
    });
  }, [collectionName]);

  return [state, setState];
}

}
// picks the blank (no name/phone/bank/account) contact as the default when adding a new
// schedule, instead of auto-selecting the trade's designated default contact — falls back
// to the first contact if the trade has no blank one
function defaultContactId(trade){
  if(!trade || !trade.contacts?.length) return "";
  const blank = trade.contacts.find(c => !c.name && !c.phone && !c.bank && !c.account);
  return blank ? blank.id : trade.contacts[0].id;
}

// 공정 목록을 공사 진행 순서대로 정렬합니다: 철거→샤시→타일→배관→가구→도배→중문→
// 장판→마감→입주청소→입주. 이 목록에 없는 공정(목공/도기/전기 등 기존 공정, 혹은
// 새로 추가한 공정)은 그 뒤에 가나다순으로 배치됩니다.
const TRADE_ORDER_SEQUENCE = ["철거","샷시","타일","배관","가구","도배","중문","장판","마감","입주청소","입주"];
// 같은 공정으로 봐야 하는 이름 (띄어쓰기 무시, 샤시=샷시)
function normTradeName(name){
  const n = (name||"").replace(/\s+/g, "");
  return n==="샤시" ? "샷시" : n;
}
function sortedTradeList(list){
  return [...list].sort((a,b) => {
    const ai = TRADE_ORDER_SEQUENCE.indexOf(normTradeName(a.name));
    const bi = TRADE_ORDER_SEQUENCE.indexOf(normTradeName(b.name));
    if(ai!==-1 && bi!==-1) return ai-bi;
    if(ai!==-1) return -1;
    if(bi!==-1) return 1;
    return a.name.localeCompare(b.name, "ko");
  });
}
// 현장의 전체 공사기간이 오늘보다 이전에 끝났으면 "종료"된 것으로 봅니다.
function isSiteEnded(site, today){
  return !!(site.projectEnd && site.projectEnd < (today || todayStr()));
}

function loadLS(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error("저장 실패 (용량 초과일 수 있어요):", e); alert("저장에 실패했습니다. 업로드한 이미지 용량이 너무 크지 않은지 확인해주세요."); }
}
function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function isSpreadsheetName(name=""){ return /\.(xlsx|xls|csv)$/i.test(name); }
function isPdfName(name=""){ return /\.pdf$/i.test(name); }
function extBadge(name=""){
  const m = name.match(/\.([a-zA-Z0-9]+)$/);
  return m ? m[1].toUpperCase().slice(0,4) : "FILE";
}
function excelDataUrlToHtml(dataUrl){
  try{
    const base64 = dataUrl.split(",")[1];
    const wb = XLSX.read(base64, { type: "base64" });
    const sheetName = wb.SheetNames[0];
    return XLSX.utils.sheet_to_html(wb.Sheets[sheetName]);
  }catch(e){
    console.error(e);
    return "<p>미리보기를 불러올 수 없습니다.</p>";
  }
}

/* ---------- root ---------- */
function App(){
  const [tab, setTab] = useState("calendar");
  const [trades, setTrades] = useSyncedState("trades", DEFAULT_TRADES);
  const [sites, setSites] = useSyncedState("sites", []);
  const [schedules, setSchedules] = useSyncedState("schedules", []);
  const [vendors, setVendors] = useSyncedState("vendors", DEFAULT_VENDORS);
  // 현장별·날짜별 출근 인원 메모 (캘린더 각 현장 맨 아래 칸)
  const [dayNotes, setDayNotes] = useSyncedState("dayNotes", []);
  const [synced, setSynced] = useState(false);

  useEffect(() => { setSynced(fbReady()); }, []);

  // if a new default trade category gets added to the app later (like "메지" was),
  // make sure everyone's existing data picks it up automatically instead of only
  // brand-new installs seeing it
  useEffect(() => {
    const missing = DEFAULT_TRADES.filter(dt => !trades.some(t => t.id===dt.id));
    if(missing.length) setTrades(prev => [...prev, ...missing.filter(dt => !prev.some(t=>t.id===dt.id))]);
  }, [trades]);

  // 같은 이름의 공정이 여러 개면 하나로 합칩니다. 지워버리면 다른 사람 화면에서 아직
  // 그 공정을 가리키는 일정이 사라질 수 있어서, 남는 쪽을 mergedInto로 표시해 두고
  // 일정은 아래 효과에서 남는 공정으로 옮깁니다. 기본 공정(DEFAULT_TRADES)이 우선 남습니다.
  useEffect(() => {
    const active = trades.filter(t => !t.mergedInto);
    const groups = {};
    active.forEach(t => { (groups[normTradeName(t.name)] = groups[normTradeName(t.name)] || []).push(t); });
    const dupGroups = Object.values(groups).filter(g => g.length>1);
    if(!dupGroups.length) return;
    const isDefaultId = id => DEFAULT_TRADES.some(d => d.id===id);
    const isBlank = c => !c.name && !c.phone && !c.bank && !c.account;
    const plan = {}; // dupId -> keepId
    const extraContacts = {}; // keepId -> contacts to add
    dupGroups.forEach(g => {
      const keep = g.find(t => isDefaultId(t.id)) || g[0];
      g.filter(t => t.id!==keep.id).forEach(t => {
        plan[t.id] = keep.id;
        (extraContacts[keep.id] = extraContacts[keep.id] || []).push(...t.contacts.filter(c => !isBlank(c)));
      });
    });
    setTrades(prev => prev.map(t => {
      if(plan[t.id]) return { ...t, mergedInto: plan[t.id] };
      if(extraContacts[t.id]){
        const add = extraContacts[t.id].filter(c => !t.contacts.some(x => x.name===c.name && x.phone===c.phone)).map(c => ({ ...c, isDefault:false }));
        return add.length ? { ...t, contacts: [...t.contacts, ...add] } : t;
      }
      return t;
    }));
  }, [trades]);
  useEffect(() => {
    const mergedMap = Object.fromEntries(trades.filter(t => t.mergedInto).map(t => [t.id, t.mergedInto]));
    if(!schedules.some(sc => mergedMap[sc.tradeId])) return;
    setSchedules(prev => prev.map(sc => mergedMap[sc.tradeId] ? { ...sc, tradeId: mergedMap[sc.tradeId] } : sc));
  }, [trades, schedules]);
  const visibleTrades = useMemo(() => trades.filter(t => !t.mergedInto), [trades]);

  // every trade should always have at least one blank spare contact slot ready to
  // fill in — add one to any trade that doesn't have one yet (existing trades included)
  useEffect(() => {
    const isBlank = c => !c.name && !c.phone && !c.bank && !c.account;
    const needsBlank = trades.some(t => !t.contacts.some(isBlank));
    if(needsBlank){
      setTrades(prev => prev.map(t => {
        if(t.contacts.some(isBlank)) return t;
        return { ...t, contacts: [...t.contacts, { id: uid(), name:"", phone:"", bank:"", account:"", isDefault:false }] };
      }));
    }
  }, [trades]);

  // give every site a display `order` value, sorted by its overall-project start date
  // the first time (sites without a start date go last). After that, order is only
  // ever changed by adding a new site (auto-placed by date) or by dragging a card
  // (see SitesTab) — so a manual drag reorder is never silently undone.
  useEffect(() => {
    if(sites.length===0) return;
    const missingOrder = sites.some(s => s.order===undefined || s.order===null);
    if(!missingOrder) return;
    const dateKey = s => s.projectStart || "9999-99-99";
    const sorted = [...sites].sort((a,b) => dateKey(a).localeCompare(dateKey(b)) || (a.createdAt||0)-(b.createdAt||0));
    setSites(sorted.map((s,i) => ({ ...s, order: i*10 })));
  }, [sites]);

  const rulerTicks = Array.from({length: 40});

  return (
    <div className="app">
      <div className="header">
        <div className="header-inner">
          <p className="eyebrow">PROJECT SCHEDULE / 도면 기준</p>
          <h1 className="title">공정표</h1>
          <p className="subtitle">현장 · 공사 담당자 · 캘린더를 한곳에서 관리합니다</p>
          <div className="tabs">
            <button className={"tab" + (tab==="calendar"?" active":"")} onClick={()=>setTab("calendar")}>공사캘린더</button>
            <button className={"tab" + (tab==="sites"?" active":"")} onClick={()=>setTab("sites")}>현장관리</button>
            <button className={"tab" + (tab==="contacts"?" active":"")} onClick={()=>setTab("contacts")}>공정별 담당자</button>
            <button className={"tab" + (tab==="vendors"?" active":"")} onClick={()=>setTab("vendors")}>거래처</button>
            <button className={"tab" + (tab==="labor"?" active":"")} onClick={()=>setTab("labor")}>담당자관리</button>
          </div>
        </div>
        <div className="ruler">{rulerTicks.map((_,i)=><span key={i}/>)}</div>
      </div>

      <div className="content">
        {tab==="sites" && (
          <SitesTab sites={sites} setSites={setSites} trades={visibleTrades} schedules={schedules} setSchedules={setSchedules} />
        )}
        {tab==="calendar" && (
          <CalendarTab sites={sites} trades={visibleTrades} setTrades={setTrades} schedules={schedules} setSchedules={setSchedules} dayNotes={dayNotes} setDayNotes={setDayNotes} />
        )}
        {tab==="contacts" && (
          <ContactsTab trades={visibleTrades} setTrades={setTrades} schedules={schedules} setSchedules={setSchedules} />
        )}
        {tab==="vendors" && (
          <VendorsTab vendors={vendors} setVendors={setVendors} />
        )}
        {tab==="labor" && (
          <LaborTab trades={visibleTrades} sites={sites} schedules={schedules} dayNotes={dayNotes} />
        )}
      </div>

      <p className="footer-note">
        {synced ? "🟢 LIVE SYNC ON — 다른 사람의 수정이 실시간으로 반영됩니다" : "DATA IS STORED LOCALLY IN THIS BROWSER — 이 브라우저에만 저장됩니다 (실시간 공유를 켜려면 README 참고)"}
      </p>
    </div>
  );
}

/* ---------- Sites tab ---------- */
function SitesTab({ sites, setSites, trades, schedules, setSchedules }){
  const [showAdd, setShowAdd] = useState(false);
  const [detailSiteId, setDetailSiteId] = useState(null);
  const [viewFile, setViewFile] = useState(null); // {name, dataUrl, isImage}
  const [dragOverSiteId, setDragOverSiteId] = useState(null);

  const detailSite = sites.find(s => s.id === detailSiteId);
  const orderedSites = [...sites].sort((a,b) => (a.order??0) - (b.order??0));
  const todayFull = todayStr();

  function addSite(site){
    setSites(prev => {
      const ordered = [...prev].sort((a,b) => (a.order??0)-(b.order??0));
      const newDate = site.projectStart || "9999-99-99";
      let insertAt = ordered.findIndex(s => (s.projectStart || "9999-99-99") > newDate);
      if(insertAt===-1) insertAt = ordered.length;
      const prevOrder = insertAt>0 ? (ordered[insertAt-1].order ?? 0) : (ordered.length ? (ordered[0].order??0)-10 : 0);
      const nextOrder = insertAt<ordered.length ? (ordered[insertAt].order ?? prevOrder+10) : prevOrder+10;
      return [...prev, { ...site, id: uid(), createdAt: Date.now(), order: (prevOrder+nextOrder)/2 }];
    });
    setShowAdd(false);
  }
  function updateSite(id, patch){
    setSites(prev => prev.map(s => s.id===id ? {...s, ...patch} : s));
  }
  function deleteSite(id){
    if(!confirm("이 현장을 삭제하면 관련 일정도 함께 삭제됩니다. 계속할까요?")) return;
    setSites(prev => prev.filter(s => s.id!==id));
    setSchedules(prev => prev.filter(sc => sc.siteId!==id));
    if(detailSiteId===id) setDetailSiteId(null);
  }
  function reorderSites(draggedId, targetId){
    if(draggedId===targetId) return;
    setSites(prev => {
      const ordered = [...prev].sort((a,b) => (a.order??0)-(b.order??0));
      const fromIdx = ordered.findIndex(s=>s.id===draggedId);
      const toIdx = ordered.findIndex(s=>s.id===targetId);
      if(fromIdx===-1 || toIdx===-1) return prev;
      const [moved] = ordered.splice(fromIdx,1);
      ordered.splice(toIdx,0,moved);
      return ordered.map((s,i)=>({...s, order:i*10}));
    });
  }

  return (
    <div>
      <div className="section-head">
        <div>
          <p className="eyebrow">SITES</p>
          <h2>공사 현장</h2>
        </div>
        <button className="btn btn-accent" onClick={()=>setShowAdd(true)}>+ 새 현장 추가</button>
      </div>

      {sites.length===0 ? (
        <div className="empty"><b>등록된 현장이 없습니다.</b><br/>“새 현장 추가”를 눌러 주소와 도면을 등록해보세요.</div>
      ) : (
        <div className="grid-sites">
          {orderedSites.map(site => {
            const ended = isSiteEnded(site, todayFull);
            return (
            <div
              className={"card site-card" + (dragOverSiteId===site.id ? " drag-over" : "") + (ended ? " site-ended" : "")}
              key={site.id}
              draggable
              onDragStart={e=>{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", site.id); }}
              onDragOver={e=>e.preventDefault()}
              onDragEnter={e=>{ e.preventDefault(); setDragOverSiteId(site.id); }}
              onDragLeave={()=>{ if(dragOverSiteId===site.id) setDragOverSiteId(null); }}
              onDrop={e=>{ e.preventDefault(); setDragOverSiteId(null); reorderSites(e.dataTransfer.getData("text/plain"), site.id); }}
              onDragEnd={()=>setDragOverSiteId(null)}
              title="드래그해서 순서를 바꿀 수 있어요"
            >
              <div className="corner" />
              <span className="drag-handle">⠿</span>
              <p className="site-name">{site.name}{ended && <span className="badge-ended">종료</span>}</p>
              <p className="site-addr">📍 {site.address || "주소 미등록"}</p>
              {site.projectStart && site.projectEnd && (
                <p className="site-addr">🗂 전체 공사: {site.projectStart} ~ {site.projectEnd} ({daySpan({startDate:site.projectStart, endDate:site.projectEnd})}일)</p>
              )}
              {site.officePhone && <p className="site-addr">🏢 {site.officeName || "관리사무소"} · {site.officePhone}</p>}
              <div className="tag-row">
                <span className={"tag" + (site.floorPlan ? " ok":"")}>{site.floorPlan ? "도면 등록됨" : "도면 없음"}</span>
                <span className={"tag" + (site.estimate ? " ok":"")}>{site.estimate ? "견적서 등록됨" : "견적서 없음"}</span>
                <span className={"tag" + (site.officePhone ? " ok":"")}>{site.officePhone ? "관리사무소 등록됨" : "관리사무소 없음"}</span>
                <span className="tag">{schedules.filter(sc=>sc.siteId===site.id).length}건 일정</span>
              </div>
              <div className="site-actions">
                <button className="btn btn-ghost btn-sm" onClick={()=>setDetailSiteId(site.id)}>일정 관리</button>
                {site.floorPlan && <button className="btn btn-ghost btn-sm" onClick={()=>setViewFile(site.floorPlan)}>도면 보기</button>}
                {site.estimate && <button className="btn btn-ghost btn-sm" onClick={()=>setViewFile(site.estimate)}>견적서 보기</button>}
                <button className="btn btn-danger btn-sm" onClick={()=>deleteSite(site.id)}>삭제</button>
              </div>
            </div>
            );
          })}
        </div>
      )}

      {showAdd && <SiteFormModal onClose={()=>setShowAdd(false)} onSave={addSite} />}
      {detailSite && (
        <SiteDetailModal
          site={detailSite}
          trades={trades}
          schedules={schedules.filter(sc=>sc.siteId===detailSite.id)}
          onClose={()=>setDetailSiteId(null)}
          onUpdateSite={patch=>updateSite(detailSite.id, patch)}
          onAddSchedule={sc=>setSchedules(prev=>[...prev, {...sc, id: uid(), siteId: detailSite.id}])}
          onUpdateSchedule={(id, patch)=>setSchedules(prev=>prev.map(s=>s.id===id ? {...s, ...patch} : s))}
          onDeleteSchedule={id=>setSchedules(prev=>prev.filter(s=>s.id!==id))}
          onViewFile={setViewFile}
        />
      )}
      {viewFile && <FileViewerModal file={viewFile} onClose={()=>setViewFile(null)} />}
    </div>
  );
}

function SiteFormModal({ onClose, onSave, initial }){

  const [manager, setManager] = useState(initial?.manager || "");
  const [color, setColor] = useState(initial?.color || "");
  const [bgColor, setBgColor] = useState(initial?.bgColor || "");
  const [address, setAddress] = useState(initial?.address || "");
  const [memo, setMemo] = useState(initial?.memo || "");
  const [floorPlan, setFloorPlan] = useState(initial?.floorPlan || null);
  const [estimate, setEstimate] = useState(initial?.estimate || null);
  const [officeName, setOfficeName] = useState(initial?.officeName || "");
  const [officePhone, setOfficePhone] = useState(initial?.officePhone || "");
  const [projectStart, setProjectStart] = useState(initial?.projectStart || "");
  const [projectEnd, setProjectEnd] = useState(initial?.projectEnd || "");

  async function handleFile(e, setter){
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 650*1024){
      alert("파일이 너무 큽니다 (650KB 이하 권장). 여러 사람과 실시간으로 공유되는 항목이라 용량 제한이 있어요. 이미지를 압축하거나 캡처본으로 올려주세요.");
      return;
    }
    const dataUrl = await fileToDataUrl(file);
    setter({
      name: file.name,
      dataUrl,
      isImage: file.type.startsWith("image/"),
      isSpreadsheet: isSpreadsheetName(file.name),
      isPdf: isPdfName(file.name) || file.type === "application/pdf",
    });
  }

  function submit(){
    if(!name.trim() || !address.trim()){ alert("현장명과 주소는 필수입니다."); return; }
    if(projectStart && projectEnd && projectEnd < projectStart){ alert("전체 공사 종료일이 시작일보다 빠를 수 없습니다."); return; }
    onSave({
      name: name.trim(), abbreviation: abbreviation.trim(), manager: manager.trim(), color, bgColor, address: address.trim(), memo: memo.trim(), floorPlan, estimate,
      officeName: officeName.trim(), officePhone: officePhone.trim(),
      projectStart, projectEnd,
    });
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-head">
          <h3>{initial ? "현장 정보 수정" : "새 현장 추가"}</h3>
          <button className="close-x" onClick={onClose}>✕</button>
        </div>

        <div className="row2">
          <div className="field">
            <label>현장명</label>
            <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="예: 서울숲 리버뷰 24평" />
          </div>
          <div className="field">
            <label>약어 (달력에 크게 표시)</label>
            <input type="text" value={abbreviation} onChange={e=>setAbbreviation(e.target.value)} placeholder="예: 홍은" />
          </div>
        </div>

        <div className="field">
          <label>현장 담당자 (달력 왼쪽 현장명 옆에 표시)</label>
          <input type="text" value={manager} onChange={e=>setManager(e.target.value)} placeholder="예: 박지현" />
        </div>

        <div className="field">
          <label>캘린더 배경색 (현장 칸 전체에 깔리는 파스텔색 · 비워두면 자동)</label>
          <div className="color-swatch-row">
            {SITE_BG_PASTELS.map(c => (
              <button
                type="button"
                key={c}
                className={"color-swatch" + (bgColor===c ? " selected" : "")}
                style={{background:c}}
                onClick={()=>setBgColor(c)}
                title={c}
              />
            ))}
            {bgColor && <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setBgColor("")}>자동으로</button>}
          </div>
        </div>

        <div className="field">
          <label>현장 글자색 (캘린더 왼쪽 현장명에 사용)</label>
          <div className="color-swatch-row">
            {SITE_COLOR_SWATCHES.map(c => (
              <button
                type="button"
                key={c}
                className={"color-swatch" + (color===c ? " selected" : "")}
                style={{background:c}}
                onClick={()=>setColor(c)}

              />
            ))}
            <label className="color-swatch color-swatch-custom" style={{background: color || "#fff"}} title="직접 선택">
              <input type="color" value={color || "#16233F"} onChange={e=>setColor(e.target.value)} />
            </label>
            {color && <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setColor("")}>기본값으로</button>}

        <div className="field">

        <div className="row2">

function QuickAddScheduleModal({ sites, initialSiteId, trades, initialDate, onClose, onAdd }){

  const [siteId, setSiteId] = useState(initialSiteId || sites[0]?.id || "");
  const site = sites.find(s => s.id===siteId);
  const CUSTOM = "__custom__";
  const [tradeId, setTradeId] = useState(CUSTOM); // 기본은 "직접 입력"
  const [customName, setCustomName] = useState("");
  const isCustom = tradeId===CUSTOM;
  // 직접 입력한 이름이 이미 있는 공정과 같으면 그 공정으로 연결합니다
  const matchedTrade = isCustom && customName.trim() ? trades.find(t => normTradeName(t.name)===normTradeName(customName)) : null;
  const trade = isCustom ? matchedTrade : trades.find(t => t.id===tradeId);
  const [startDate, setStartDate] = useState(initialDate);
  const [endDate, setEndDate] = useState(initialDate);
  const [contactId, setContactId] = useState(defaultContactId(trade));
  const [workerName, setWorkerName] = useState("");
  const [laborUnits, setLaborUnits] = useState("");
  const [memo, setMemo] = useState("");

  function handleTradeChange(id){
    setTradeId(id);
    const t = trades.find(x => x.id===id);
    setContactId(defaultContactId(t));
  }
  function handleStartChange(v){
    setStartDate(v);

    onAdd(siteId, { tradeId: isCustom ? (matchedTrade?.id || null) : tradeId, contactId: finalContactId, startDate, endDate: endDate<startDate ? startDate : endDate, workerName: workerName.trim(), laborUnits: laborUnits==="" ? null : Number(laborUnits), memo }, isCustom && !matchedTrade ? customName.trim() : null);

          <div className="field">
            <label>공정</label>
            <select value={tradeId} onChange={e=>handleTradeChange(e.target.value)}>

          </div>

// 일당: 일정에 따로 입력한 값이 있으면 그 값을, 없으면 담당자에 등록된 기본 일당을 씁니다.
function effectiveDailyWage(sc, contact){
  if(sc.dailyWage!=null && sc.dailyWage!=="") return Number(sc.dailyWage);
  if(contact && contact.dailyWage!=null && contact.dailyWage!=="") return Number(contact.dailyWage);
  return null;
}
// 품수를 입력하지 않았으면 작업 일수만큼(하루 1품) 나온 것으로 계산합니다.
function effectiveUnits(sc){
  return sc.laborUnits!=null ? Number(sc.laborUnits) : daySpan(sc);
}
const won = n => n==null ? "-" : Math.round(n).toLocaleString("ko-KR") + "원";

// 일정에 담당자를 따로 고르지 않았거나 빈 담당자가 선택돼 있으면,
// "공정별 담당자" 탭에서 기본으로 지정한 담당자를 대신 보여줍니다.
function resolveContact(sc, trade){
  if(!trade) return null;
  const isBlank = c => !c.name && !c.phone && !c.bank && !c.account;
  const picked = trade.contacts.find(c => c.id===sc.contactId);
  if(picked && !isBlank(picked)) return picked;
  return trade.contacts.find(c => c.isDefault && !isBlank(c)) || trade.contacts.find(c => !isBlank(c)) || null;
}

// 캘린더 각 현장 맨 아래의 "그날 출근 인원" 칸. 입력을 마치고 칸을 벗어나거나
// Enter를 누르면 저장됩니다 (글자마다 저장하지 않아 여러 명이 동시에 써도 덜 엉킵니다).
/* ---------- 손님용 JPG: 현장 하나의 공사기간을 달력 모양으로 그려서 저장 ---------- */
// 공정 이름만 들어가고, 메모·출근 인원·담당자·금액은 넣지 않습니다.
function drawCustomerCalendar({ site, schedules, tradeById, bg }){
  const siteSchedules = schedules.filter(sc => sc.siteId===site.id && sc.tradeId!=="misc" && tradeById[sc.tradeId]);
  // 표시할 기간: 현장 전체 공사기간 → 없으면 일정의 처음~끝 → 없으면 이번 달
  // 머리말의 공사기간은 등록된 전체 공사기간을 쓰고, 달력은 실제 공정이 있는 달만 그립니다
  let start = site.projectStart, end = site.projectEnd;
  const ranges = siteSchedules.map(scheduleRange);
  const schStart = ranges.length ? ranges.reduce((a,r)=>r.start<a?r.start:a, ranges[0].start) : null;
  const schEnd = ranges.length ? ranges.reduce((a,r)=>r.end>a?r.end:a, ranges[0].end) : null;
  if(!start || !end){ start = schStart || todayStr(); end = schEnd || start; }
  const calStart = schStart || start, calEnd = schEnd || end;
  const months = [];
  let [y, m] = calStart.split("-").map(Number); m -= 1;
  const [ey, em] = calEnd.split("-").map(Number);
  while((y < ey || (y===ey && m <= em-1)) && months.length < 6){ months.push({y, m}); m++; if(m>11){ m=0; y++; } }
  if(!months.length) months.push({y, m});

  const tradesOn = date => {
    const names = [];
    names.colors = {};
    siteSchedules.forEach(sc => { const r = scheduleRange(sc); if(date>=r.start && date<=r.end){ const n = tradeById[sc.tradeId].name; if(!names.includes(n)){ names.push(n); names.colors[n] = tradeById[sc.tradeId].color; } } });
    return names;
  };

  const W = 1400, PAD = 48, COLW = (W - PAD*2) / 7, DOWH = 40, PILLH = 30;
  const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
  // 높이 계산을 먼저 해서 캔버스 크기를 정합니다
  const monthLayouts = months.map(({y, m}) => {
    const firstDow = new Date(y, m, 1).getDay(), dim = new Date(y, m+1, 0).getDate();
    const cells = [...Array(firstDow).fill(null), ...Array.from({length: dim}, (_, i) => i+1)];
    while(cells.length % 7) cells.push(null);
    const weeks = [];
    for(let i=0;i<cells.length;i+=7){
      const days = cells.slice(i, i+7).map(d => d ? { d, date: `${y}-${pad(m+1)}-${pad(d)}` } : null);
      const maxItems = Math.max(0, ...days.map(x => x ? tradesOn(x.date).length : 0));
      weeks.push({ days, h: Math.max(96, 40 + maxItems*(PILLH+6) + 8) });
    }
    return { y, m, weeks, h: 64 + DOWH + weeks.reduce((a,w)=>a+w.h, 0) + 36 };
  });
  const HEADER = 150;
  const H = HEADER + monthLayouts.reduce((a,l)=>a+l.h, 0) + 30;
  const scale = 2;
  const canvas = document.createElement("canvas");
  canvas.width = W*scale; canvas.height = H*scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);

  // 머리말
  ctx.fillStyle = "#16233F"; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = "#16233F"; ctx.font = `800 38px ${FONT}`; ctx.textBaseline = "alphabetic";
  ctx.fillText(`${site.name} 공사 일정표`, PAD, 72);
  ctx.fillStyle = "#5B5F66"; ctx.font = `600 20px ${FONT}`;
  ctx.fillText(`공사기간  ${start} ~ ${end}`, PAD, 110);
  ctx.strokeStyle = "#E1D9C4"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(PAD, 132); ctx.lineTo(W-PAD, 132); ctx.stroke();

  const pillBg = bg || "#CFE3FF";
  const pillDeep = deepenColor(pillBg, 0.12);
  let yCur = HEADER;
  monthLayouts.forEach(layout => {
    ctx.fillStyle = "#16233F"; ctx.font = `800 28px ${FONT}`;
    ctx.fillText(`${layout.y}년 ${layout.m+1}월`, PAD, yCur + 42);
    let yy = yCur + 64;
    // 요일 줄
    DOW.forEach((dw, i) => {
      const x = PAD + i*COLW;
      ctx.fillStyle = "#1E3A5F"; ctx.fillRect(x, yy, COLW, DOWH);
      ctx.fillStyle = i===0 ? "#FF9A92" : i===6 ? "#9ADCFF" : "#ffffff";
      ctx.font = `700 17px ${FONT}`; ctx.textAlign = "center";
      ctx.fillText(dw, x + COLW/2, yy + 26);
      ctx.textAlign = "left";
    });
    yy += DOWH;
    layout.weeks.forEach(week => {
      week.days.forEach((cell, i) => {
        const x = PAD + i*COLW;
        ctx.fillStyle = cell ? "#ffffff" : "#F4F4F2"; ctx.fillRect(x, yy, COLW, week.h);
        ctx.strokeStyle = "#C9CDD2"; ctx.lineWidth = 1; ctx.strokeRect(x+0.5, yy+0.5, COLW, week.h);
        if(!cell) return;
        const hol = krHoliday(cell.date);
        ctx.fillStyle = (i===0 || hol) ? "#D9483B" : i===6 ? "#2A78C2" : "#23262B";
        ctx.font = `800 18px ${FONT}`;
        ctx.fillText(String(cell.d), x + 10, yy + 26);
        if(hol){ ctx.font = `600 13px ${FONT}`; ctx.fillText(hol, x + 40, yy + 25); }
        const dayTrades = tradesOn(cell.date);
        dayTrades.forEach((name, k) => {
          const py = yy + 38 + k*(PILLH+6), px = x + 7, pw = COLW - 14;
          ctx.fillStyle = pillBg;
          ctx.beginPath();
          if(ctx.roundRect) ctx.roundRect(px, py, pw, PILLH, 6); else ctx.rect(px, py, pw, PILLH);
          ctx.fill();
          ctx.fillStyle = pillDeep; ctx.fillRect(px, py, 4, PILLH);
          ctx.fillStyle = tradeTextColor(dayTrades.colors[name]); ctx.font = `800 17px ${FONT}`;
          let label = name;
          while(ctx.measureText(label).width > pw - 20 && label.length > 1) label = label.slice(0, -1);
          if(label!==name) label = label.slice(0, -1) + "…";
          ctx.fillText(label, px + 12, py + 21);
        });
      });
      yy += week.h;
    });
    yCur += layout.h;
  });
  return canvas;
}

// 출근 인원: dayNotes 문서 하나 = 현장 하나의 하루. workers: [{name, wage}]
// 예전에 칸에 직접 써둔 글(text)은 이름이 없으면 그대로 보여줍니다.
function formatWageShort(w){
  if(w==null || w==="" || isNaN(Number(w))) return "";
  const n = Number(w);
  if(n>=10000 && n%1000===0){ const man = n/10000; return (Number.isInteger(man) ? man : man.toFixed(1).replace(/\.0$/,"")) + "만"; }
  return n.toLocaleString("ko-KR");
}
function formatWorkers(note){
  if(!note) return "";
  const ws = (note.workers||[]).filter(x => x.name);
  if(ws.length) return ws.map(x => x.name + (formatWageShort(x.wage) ? `(${formatWageShort(x.wage)})` : "")).join(", ");
  return note.text || "";
}

function DayWorkerCell({ note, onClick, style }){
  const label = formatWorkers(note);

    <div className={"day-note-cell" + (label ? " has-value" : "")} style={style} onClick={onClick} title="클릭해서 그날 출근한 사람·일당 입력">

}

function SiteMultiSelect({ sites, selectedSiteIds, onChange }){
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function handleOutside(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, []);

  const allSelected = selectedSiteIds===null;
  const isChecked = id => allSelected || selectedSiteIds.includes(id);
  const selectedCount = allSelected ? sites.length : selectedSiteIds.length;
  const activeIds = sites.filter(s => !isSiteEnded(s)).map(s => s.id);
  const onlyActiveSelected = !allSelected && activeIds.length>0 && activeIds.length<sites.length
    && selectedSiteIds.length===activeIds.length && activeIds.every(id => selectedSiteIds.includes(id));
  const label = sites.length===0 ? "현장 없음"
    : allSelected ? "전체 현장"
    : onlyActiveSelected ? `진행중 현장 ${activeIds.length}개`
    : selectedCount===0 ? "현장 선택"
    : selectedCount===1 ? sites.find(s=>isChecked(s.id))?.name || "1개 현장"
    : `현장 ${selectedCount}개 선택`;

  function toggleSite(id){
    if(allSelected){
      onChange(sites.map(s=>s.id).filter(sid=>sid!==id));
    } else {
      const next = selectedSiteIds.includes(id) ? selectedSiteIds.filter(x=>x!==id) : [...selectedSiteIds, id];
      onChange(next.length===sites.length ? null : next);
    }
  }

  // 목록에서는 진행중인 현장을 먼저 보여주고, 종료된 현장은 아래로 내려서
  // 종료일이 최근인 순서(과거순)로 나열합니다.
  const sortedSites = [...sites].sort((a,b) => {
    const aEnded = isSiteEnded(a), bEnded = isSiteEnded(b);
    if(aEnded!==bEnded) return aEnded ? 1 : -1;
    if(aEnded && bEnded) return (b.projectEnd||"").localeCompare(a.projectEnd||"");
    return (a.order??0) - (b.order??0);
  });

  return (
    <div className="site-multiselect" ref={ref}>
      <button type="button" className="site-multiselect-btn" onClick={()=>setOpen(o=>!o)}>{label} ▾</button>
      {open && (
        <div className="site-multiselect-panel">
          <div className="site-multiselect-actions">
            <button type="button" className={onlyActiveSelected ? "on" : ""} onClick={()=>onChange(activeIds)} disabled={!activeIds.length}>진행중 {activeIds.length}개</button>
            <button type="button" onClick={()=>onChange(null)}>전체 선택</button>
            <button type="button" onClick={()=>onChange([])}>전체 해제</button>
          </div>
          {sites.length===0 ? (
            <p className="site-multiselect-empty">등록된 현장이 없습니다</p>
          ) : sortedSites.map(s => (
            <label className="site-multiselect-item" key={s.id}>
              <input type="checkbox" checked={isChecked(s.id)} onChange={()=>toggleSite(s.id)} />
              {s.name}{isSiteEnded(s) && <span style={{color:"var(--ink-soft)", fontWeight:600}}> (종료)</span>}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function CalendarTab({ sites, trades, setTrades, schedules, setSchedules, dayNotes, setDayNotes }){
  const dayNoteMap = useMemo(() => Object.fromEntries(dayNotes.map(n => [n.id, n])), [dayNotes]);
  const [workerEdit, setWorkerEdit] = useState(null); // { siteId, date }
  // 이름 자동완성 + 그 사람의 가장 최근 일당 자동 입력
  const { nameSuggestions, lastWageByName } = useMemo(() => {
    const sorted = [...dayNotes].sort((a,b) => (a.date||"").localeCompare(b.date||""));
    const last = {};
    sorted.forEach(n => (n.workers||[]).forEach(w => { if(w.name && w.wage!=null) last[w.name] = w.wage; else if(w.name && !(w.name in last)) last[w.name] = null; }));
    return { nameSuggestions: Object.keys(last).sort((a,b)=>a.localeCompare(b,"ko")), lastWageByName: last };
  }, [dayNotes]);
  function saveDayWorkers(siteId, dateStr, workers, text){
    const id = `${siteId}_${dateStr}`;
    setDayNotes(prev => {
      const others = prev.filter(n => n.id!==id);
      return (workers.length || text) ? [...others, { id, siteId, date: dateStr, workers, text: text || "" }] : others;
    });
  }
  const [showJpg, setShowJpg] = useState(false);
  const [printMenuOpen, setPrintMenuOpen] = useState(false);
  const [printMonth, setPrintMonth] = useState(null); // {y, m} — 인쇄할 달
  const printMenuRef = useRef(null);
  useEffect(() => {
    function outside(e){ if(printMenuRef.current && !printMenuRef.current.contains(e.target)) setPrintMenuOpen(false); }
    document.addEventListener("mousedown", outside);
    return () => document.removeEventListener("mousedown", outside);
  }, []);
  // 인쇄: 고른 달 하나만 따로 그린 뒤 브라우저 인쇄창을 띄우고, 끝나면 원래 화면으로
  function startPrint(m){
    setPrintMonth(m);
    document.body.classList.add("printing");
    const done = () => { document.body.classList.remove("printing"); setPrintMonth(null); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    // 한 달 전체가 A4 가로 한 장에 들어가도록, 화면 밖에서 크기를 재고 그만큼 축소합니다
    setTimeout(() => {
      const el = document.querySelector(".print-area");

  function addMonths({y, m}, delta){
    let nm = m + delta, ny = y;
    while(nm<0){ nm+=12; ny--; }
    while(nm>11){ nm-=12; ny++; }
    return { y: ny, m: nm };
  }

  // build full weeks (leading/trailing blanks included) so bars line up cleanly row by row
  function buildWeeks(y, m){
    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const totalCells = firstDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    const cellsFull = [];
    for(let i=0;i<firstDow;i++) cellsFull.push(null);
    for(let d=1; d<=daysInMonth; d++) cellsFull.push(d);
    for(let i=0;i<trailing;i++) cellsFull.push(null);
    const out = [];
    for(let i=0;i<cellsFull.length;i+=7) out.push(cellsFull.slice(i,i+7));
    return out;
  }

  // builds one uninterrupted sequence of weeks spanning several consecutive months —
  // no blank filler between the end of one month and the start of the next, only at
  // the very start (before the 1st Sunday) and very end (after the last Saturday)
  function buildContinuousWeeks(monthCursors){
    const first = monthCursors[0], last = monthCursors[monthCursors.length-1];
    const firstDate = new Date(first.y, first.m, 1);
    const lastDate = new Date(last.y, last.m+1, 0);
    const firstDow = firstDate.getDay();
    const totalDays = Math.round((lastDate - firstDate) / 86400000) + 1;
    const trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
    // 첫 주 앞쪽·마지막 주 뒤쪽 빈칸도 이전/다음 달 실제 날짜로 채워서 이어지게 보여줍니다 (outside 표시)
    const cells = [];
    for(let i=-firstDow;i<totalDays+trailing;i++){
      const d = new Date(firstDate); d.setDate(d.getDate()+i);
      cells.push({ y: d.getFullYear(), m: d.getMonth(), day: d.getDate(), outside: i<0 || i>=totalDays });
    }
    const weeks = [];
    for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
    return weeks;
  }

  // renders one month's dow-row + week grid (used twice, stacked vertically)
  function renderCalendarBlock(monthCursors, sitesOverride){
    const weeks = buildContinuousWeeks(monthCursors);
    const siteList = sitesOverride || relevantSites;
    // 인쇄처럼 현장 목록을 따로 넘기면, 현장 선택 필터와 상관없이 그 현장들의 전체 일정을 씁니다
    const pool = sitesOverride ? schedules : filtered;
    const rangeFor = site => {
      if(!sitesOverride) return siteRanges[site.id];
      if(site.projectStart && site.projectEnd) return scheduleRange({ startDate: site.projectStart, endDate: site.projectEnd });
      const rs = pool.filter(sc => sc.siteId===site.id).map(scheduleRange);
      if(!rs.length) return null;
      return { start: rs.reduce((a,r)=>r.start<a?r.start:a, rs[0].start), end: rs.reduce((a,r)=>r.end>a?r.end:a, rs[0].end) };
    };
    const monthKeyOf = cell => cell ? `${cell.y}-${cell.m}` : null;

    // segments are only used to place the big faint month-number watermark —
    // approximate centering is fine there. Actual tinting and the boundary line
    // are computed per cell below, directly from each cell's own date, so a row
    // that's mostly one month never gets mis-tinted by a single day from the next.
    const weekMonthKey = week => {
      const counts = {};
      week.forEach(c => { if(c && !c.outside){ const k = monthKeyOf(c); counts[k] = (counts[k]||0)+1; } });
      let best = null, bestCount = 0;
      Object.entries(counts).forEach(([k,v]) => { if(v>bestCount){ best=k; bestCount=v; } });
      return best;
    };
    // 선택된 현장이 하나도 일하지 않는 주는 숨깁니다 (예: 11월에 시작하는 현장만 고르면 10월 주들은 안 보임)
    const sitesActiveInWeek = week => {
      const ds = week.map(c => c ? dateStrFor(c.y, c.m, c.day) : null);
      return siteList.filter(site => ds.some(d => {
        if(!d) return false;
        const range = rangeFor(site);
        if(range && d>=range.start && d<=range.end) return true;
        return pool.some(sc => sc.siteId===site.id && (() => { const {start,end}=scheduleRange(sc); return d>=start && d<=end; })());
      }));
    };
    const weekSites = weeks.map(sitesActiveInWeek);
    const segments = [];
    weeks.forEach((week, wi) => {
      if(!weekSites[wi].length) return;
      const key = weekMonthKey(week);
      const last = segments[segments.length-1];
      if(last && last.key===key) last.weekIndices.push(wi);
      else segments.push({ key, weekIndices:[wi] });
    });

    if(!segments.length){
      return <div className="empty">이 기간에는 선택된 현장의 공정이 없어요.<br/>‹ › 버튼으로 다른 달을 보거나, 현장 선택을 바꿔보세요.</div>;
    }
    return (
      <div className="card cal-continuous">
        {segments.map((seg, si) => {
          const [segY, segM] = seg.key ? seg.key.split("-").map(Number) : [null, null];
          return (
            <div className="cal-month-segment" key={seg.key || si} style={{display:"flex"}}>
              {segM!==null ? (
                <div className="cal-month-badge">{segY}<br/>{pad(segM+1)}월</div>
              ) : <div className="cal-month-rail-spacer" />}
              <div style={{flex:1, minWidth:0}}>
              {seg.weekIndices.map(wi => {
                const weekDays = weeks[wi];
                const dateStrs = weekDays.map(c => c ? dateStrFor(c.y, c.m, c.day) : null);
                const weekParity = wi % 2 === 0 ? " week-stripe-a" : " week-stripe-b";
                // only show a site's label/lane this week if it's actually active on at
                // least one day of the week — otherwise its name would show for weeks
                // that have nothing scheduled for it at all
                const weekSiteList = weekSites[wi];
                return (
                  <div className={"week-row" + weekParity} key={wi}>
                    <div className="cal-grid has-labels cal-date-row">
                      <div className="cal-dow-spacer" />
                      {weekDays.map((cell, di) => {
                        const dateStr = dateStrs[di];
                        const aboveCell = wi>0 ? weeks[wi-1][di] : null;
                        const leftCell = di>0 ? weekDays[di-1] : null;
                        const topBoundary = cell && aboveCell && monthKeyOf(cell)!==monthKeyOf(aboveCell);
                        const leftBoundary = cell && leftCell && monthKeyOf(cell)!==monthKeyOf(leftCell);
                        const tintOn = cell && cell.m % 2 === 1;
                        const holidayName = cell && krHoliday(dateStr);
                        return (
                          <div
                            key={di}
                            className={"cal-cell" + (!cell ? " empty-cell" : "") + (tintOn ? " month-tint-cell" : "") + (cell && cell.outside ? " outside-month" : "") + (holidayName ? " holiday-cell" : "") + (dateStr===todayFull ? " today" : "") + (selectedDate===dateStr && cell ? " picked" : "") + (dragOverDate===dateStr && cell ? " drag-over" : "") + (topBoundary ? " month-boundary-top" : "") + (leftBoundary ? " month-boundary-left" : "")}
                            onClick={()=> cell && setSelectedDate(dateStr)}
                            onDragOver={e=>{ if(cell) e.preventDefault(); }}
                            onDragEnter={e=>{ if(cell){ e.preventDefault(); setDragOverDate(dateStr); } }}
                            onDragLeave={()=>{ if(dragOverDate===dateStr) setDragOverDate(null); }}
                            onDrop={e=>{ if(cell) handleCellDrop(e, dateStr); }}
                          >
                            {cell && (
                              <span className={"cal-date" + (di===0 || holidayName ? " cal-date-sun" : "") + (di===6 && !holidayName ? " cal-date-sat" : "")}>
                                {cell.outside ? `${cell.m+1}/${cell.day}` : cell.day}<span className="cal-dow-inline">{holidayName || DOW[di]}</span>
                              </span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    {weekSiteList.length>0 && (() => {
                      const weekStart = dateStrs.find(Boolean);
                      const lastValid = [...dateStrs].reverse().find(Boolean);
                      const weekEnd = lastValid;
                      let rowCursor = 1;
                      const siteBlocks = weekSiteList.map((site, sidx) => {
                        const siteSchedules = pool.filter(sc => sc.siteId===site.id && sc.tradeId!=="misc");
                        const rawEvents = [];
                        siteSchedules.forEach(sc => {
                          const { start, end } = scheduleRange(sc);
                          if(!weekStart || !weekEnd || end<weekStart || start>weekEnd) return;
                          const trade = tradeById[sc.tradeId];
                          if(!trade) return;
                          const clipStart = start<weekStart ? weekStart : start;
                          const clipEnd = end>weekEnd ? weekEnd : end;
                          rawEvents.push({ sc, trade, start: clipStart, end: clipEnd });
                        });
                        rawEvents.sort((a,b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
                        // merge separate schedule records of the SAME trade into one bar when
                        // their date ranges are adjacent or overlapping, so "같은 공정 연속 일정"
                        // shows as a single continuous bar even if entered as separate records
                        const events = [];
                        const byTrade = {};
                        rawEvents.forEach(ev => {
                          (byTrade[ev.trade.id] = byTrade[ev.trade.id] || []).push(ev);
                        });
                        Object.values(byTrade).forEach(list => {
                          list.sort((a,b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
                          let cur = null;
                          list.forEach(ev => {
                            if(cur && ev.start <= shiftDateStr(cur.end, 1)){
                              if(ev.end > cur.end) cur.end = ev.end;
                              cur.scs.push(ev.sc);
                            } else {
                              cur = { sc: ev.sc, trade: ev.trade, start: ev.start, end: ev.end, scs: [ev.sc] };
                              events.push(cur);
                            }
                          });
                        });
                        events.sort((a,b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
                        // 줄 배치: 끌어다 놓아서 줄을 지정한 일정(slotPref)을 먼저 그 줄에 두고,
                        // 나머지는 비어 있는 가장 위 줄부터 자동으로 채웁니다
                        const slotRanges = []; // slot -> [[start,end], ...]
                        const isFree = (slot, ev) => !(slotRanges[slot]||[]).some(([a,b]) => !(ev.end < a || ev.start > b));
                        const place = (ev, slot) => { (slotRanges[slot] = slotRanges[slot] || []).push([ev.start, ev.end]); ev.slot = slot; };
                        events.forEach(ev => {
                          const pref = ev.scs.map(x => x.slotPref).find(v => v!=null);
                          ev.pref = pref!=null ? Number(pref) : null;
                        });
                        events.filter(ev => ev.pref!=null).forEach(ev => { if(isFree(ev.pref, ev)) place(ev, ev.pref); });
                        events.filter(ev => ev.slot==null).forEach(ev => {
                          let slot = 0;
                          while(!isFree(slot, ev)) slot++;
                          place(ev, slot);
                        });
                        const slotCount = Math.max(3, slotRanges.length);
                        const slotsRender = [];
                        for(let s=0; s<slotCount; s++){
                          const slotEvents = events.filter(ev => ev.slot===s);
                          const coverage = Array(7).fill(null);
                          slotEvents.forEach(ev => {
                            const si = dateStrs.indexOf(ev.start), ei = dateStrs.indexOf(ev.end);
                            for(let d=si; d<=ei; d++) if(d>=0) coverage[d] = ev;
                          });
                          const cells = [];
                          let d = 0;
                          while(d<7){
                            if(!dateStrs[d]){ cells.push({type:"blank", colStart:d+1, colEnd:d+2}); d++; continue; }
                            const ev = coverage[d];
                            if(ev){
                              // 출력해서 현장에 붙여도 헷갈리지 않도록, 연속 공정도 하루하루
                              // 칸을 나눠서 매일 공정명이 보이게 합니다 (같은 줄은 유지)
                              const dayStr = dateStrs[d];
                              const daySc = ev.scs.find(s => { const r = scheduleRange(s); return dayStr>=r.start && dayStr<=r.end; }) || ev.sc;
                              cells.push({ type:"bar", event: ev, daySc, colStart: d+1, colEnd: d+2, dateStr: dayStr });
                              d++;
                            } else {
                              cells.push({ type:"empty", colStart: d+1, colEnd: d+2, dateStr: dateStrs[d] });
                              d++;
                            }
                          }
                          slotsRender.push(cells);
                        }
                        const rowStart = rowCursor;
                        const rowEnd = rowCursor + slotCount + 1; // +1 = 맨 아래 출근 인원 칸
                        rowCursor = rowEnd;
                        return { site, sidx, rowStart, rowEnd, slotCount, slotsRender };
                      });
                      return (
                        <div className="cal-grid has-labels cal-site-row-grid" style={{gridAutoRows:"auto"}}>
                          {siteBlocks.map(({ site, sidx, rowStart, rowEnd, slotsRender }) => (
                            <React.Fragment key={site.id}>
                              <div
                                className={"site-label-tab" + (site.abbreviation ? " has-abbr" : "")}
                                style={{ gridColumn:"1", gridRow:`${rowStart} / ${rowEnd}`, background: siteBgMap[site.id], color: siteColorMap[site.id] }}
                                title={site.name + (site.manager ? ` (${site.manager})` : "")}
                              >
                                <div className="site-label-tab-inner">
                                  {site.abbreviation ? (
                                    <span className="site-label-abbr">
                                      {formatAbbrLines(site.abbreviation).map((line, i, arr) => (
                                        <React.Fragment key={i}>{line}{i<arr.length-1 && <br/>}</React.Fragment>
                                      ))}
                                    </span>
                                  ) : <span>{site.name}</span>}
                                </div>
                              </div>
                              {slotsRender.map((cells, si) => cells.map((c, ci) => {
                                const rowLine = rowStart + si;
                                const extraStyle = (si===0 && sidx>0) ? { borderTop:"2px solid var(--excel-line)" } : {};
                                if(c.type==="blank"){
                                  return <div key={ci} style={{gridColumn:`${c.colStart+1} / ${c.colEnd+1}`, gridRow: rowLine, ...extraStyle}} />;
                                }
                                if(c.type==="empty"){
                                  return (
                                    <div
                                      key={ci}
                                      className={"trade-slot-empty" + (dragOverDate===c.dateStr ? " drop-target" : "")}
                                      style={{gridColumn:`${c.colStart+1} / ${c.colEnd+1}`, gridRow: rowLine, ...extraStyle, background: siteBgMap[site.id]}}
                                      title="클릭해서 이 날짜에 공정 추가"
                                      onDragOver={e=>e.preventDefault()}
                                      onDragEnter={e=>{ e.preventDefault(); setDragOverDate(c.dateStr); }}
                                      onDrop={e=>{ e.stopPropagation(); handleCellDrop(e, c.dateStr, si); }}
                                      onClick={e=>{ e.stopPropagation(); setQuickAdd({siteId: site.id, date: c.dateStr}); }}
                                    />
                                  );
                                }
                                const tr = c.event;
                                const sc = c.daySc;
                                const r = scheduleRange(sc);
                                return (
                                  <div
                                    key={ci}
                                    className={"trade-day-chip" + (dragOverDate===c.dateStr ? " drop-target" : "")}
                                    style={{ gridColumn:`${c.colStart+1} / ${c.colEnd+1}`, gridRow: rowLine, ...extraStyle, background: deepenColor(siteBgMap[site.id], 0.1) }}
                                    title={`${site.name} · ${tr.trade.name}${sc.workerName ? " · "+sc.workerName : ""}${sc.memo ? " · "+sc.memo : ""} (${r.start} ~ ${r.end}) — 클릭하면 수정, 드래그로 날짜 이동`}
                                    draggable
                                    onDragStart={e=>handleChipDragStart(e, sc.id, c.dateStr)}
                                    onDragEnd={()=>setDragOverDate(null)}
                                    onDragOver={e=>e.preventDefault()}
                                    onDragEnter={e=>{ e.preventDefault(); setDragOverDate(c.dateStr); }}
                                    onDrop={e=>{ e.stopPropagation(); handleCellDrop(e, c.dateStr, si); }}
                                    onClick={e=>{ e.stopPropagation(); setEditingScheduleId(sc.id); }}
                                  >
                                    <span className="chip-main" style={{fontSize: chipFontSize+"px", color: tradeTextColor(tr.trade.color)}}>
                                      {tr.trade.name}{sc.memo && ` (${sc.memo})`}
                                    </span>
                                  </div>
                                );
                              }))}
                              {dateStrs.map((ds, d) => ds ? (
                                <DayWorkerCell
                                  key={"note"+d}
                                  note={dayNoteMap[`${site.id}_${ds}`]}
                                  onClick={e=>{ e.stopPropagation(); setWorkerEdit({ siteId: site.id, date: ds }); }}
                                  style={{ gridColumn: d+2, gridRow: rowEnd-1, background: siteBgMap[site.id] }}
                                />
                              ) : (
                                <div key={"note"+d} style={{ gridColumn: d+2, gridRow: rowEnd-1 }} />
                              ))}
                            </React.Fragment>
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                );
              })}
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  return (
    <div>
      <div className="section-head no-print">
        <div>
          <p className="eyebrow">SCHEDULE OVERVIEW</p>
          <h2>공사 캘린더</h2>
        </div>
        <div style={{display:"flex", gap:10, alignItems:"center", flexWrap:"wrap"}}>
          <div className="view-toggle" title="공정 막대 글자 크기">
            <button className={chipFontSize===22?"active":""} onClick={()=>setChipFontSize(22)}>기본</button>
            <button className={chipFontSize===17?"active":""} onClick={()=>setChipFontSize(17)}>작게</button>
          </div>
          <div className="cal-filter">
            <SiteMultiSelect sites={sites} selectedSiteIds={selectedSiteIds} onChange={ids=>{setSelectedSiteIds(ids); setSelectedDate(null);}} />
          </div>
          <div className="cal-nav">
            <button onClick={()=>changeMonth(-1)}>‹</button>
            <span className="cal-month">{cursor.y}.{pad(cursor.m+1)} - {addMonths(cursor,1).y}.{pad(addMonths(cursor,1).m+1)}</span>
            <button onClick={()=>changeMonth(1)}>›</button>

      <div className="export-bar no-print">

                  {m.y}년 {m.m+1}월 인쇄
